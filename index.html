<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Legal Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>AI Legal Assistant</h1>
    <p>An educational tool for law students</p>
</header>

<main>
    <section>
        <h2>Ask a Legal Question</h2>

        <input
            type="text"
            id="question"
            placeholder="Type your legal question">

        <button onclick="answerQuestion()">
            Get Answer
        </button>

        <h3>Answer</h3>

        <p id="answer">
            Your answer will appear here.
        </p>
    </section>
</main>

<footer>
    <p>Created by Vasil Dadoyan with AI support.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
